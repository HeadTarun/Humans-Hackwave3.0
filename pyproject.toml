[project]
name = "healtest"
version = "0.1.0"
description = "Intent-aware self-healing E2E testing platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "starlette>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
