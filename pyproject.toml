[project]
name = "healtest"
version = "0.1.0"
description = "Intent-aware self-healing E2E testing platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "tree-sitter>=0.23.2",
    "tree-sitter-javascript>=0.23.1",
    "supabase>=2.11.0",
    "PyJWT>=2.10.1",
    "e2b>=2.55.1",
    "e2b-code-interpreter>=2.10.5",
    "playwright>=1.49.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
